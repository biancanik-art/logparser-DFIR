name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            runtime_id: 'macos-arm64'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            runtime_id: 'macos-x64'
          - platform: 'ubuntu-22.04'
            args: '--bundles deb'
            runtime_id: 'linux-x64'
          - platform: 'windows-latest'
            args: ''
            runtime_id: 'windows-x64'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libfuse2 squashfs-tools

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install Node for frontend regression tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify the direct AI search flow
        run: |
          node --check frontend/app.js
          node --test frontend/tests/guided-query-flow.test.cjs frontend/tests/ai-evidence-assistant.test.cjs

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install Python for the pinned model fetch
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test the pinned llama.cpp runtime fetcher
        run: python scripts/test_fetch_llama_runtime.py

      - name: Cache pinned local-AI resources
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/resources/models
            src-tauri/resources/llama-cpp-runtime
          key: offline-ai-runtime-${{ matrix.runtime_id }}-b12080-minilm-53aa5117-be50c362-953f9c0d

      - name: Fetch and verify pinned local-AI semantic resources
        run: python scripts/fetch_llm_resources.py

      - name: Fetch and verify pinned llama.cpp runtime
        run: python scripts/fetch_llama_runtime.py --platform ${{ matrix.runtime_id }}

      - name: Verify llama-server executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& ".\src-tauri\resources\llama-cpp-runtime\llama-server.exe" --version'

      - name: Verify llama-server executable (Unix)
        if: runner.os == 'Linux' || matrix.runtime_id == 'macos-arm64'
        shell: bash
        run: ./src-tauri/resources/llama-cpp-runtime/llama-server --version

      - name: Verify llama-server architecture (macOS Intel cross-build)
        if: matrix.runtime_id == 'macos-x64'
        shell: bash
        run: file ./src-tauri/resources/llama-cpp-runtime/llama-server | grep -q 'x86_64'

      - name: Run backend security and runtime unit tests
        if: runner.os != 'Windows'
        run: |
          cargo test local_ai_manager --lib
          cargo test local_ai_runtime --lib
          cargo test cloud_ai --lib
        working-directory: src-tauri

      # Windows runners currently compile the Rust test binary successfully but
      # cannot launch it because of runner-side DLL loader error 0xc0000139.
      # Execute the same tests on Linux/macOS and retain full Windows compile coverage.
      - name: Compile backend security and runtime unit tests (Windows)
        if: runner.os == 'Windows'
        run: cargo test --lib --no-run
        working-directory: src-tauri

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: 1
        with:
          projectPath: src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'logparser-DFIR v__VERSION__'
          releaseBody: |
            Pre-built installers for Windows, macOS (Apple Silicon and Intel), and Linux.
            See the assets below to download and install.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}


